name: Update Space Shooter Game

on:
  schedule:
    - cron: '0 0 * * *'  # Roda todo dia à meia-noite (UTC)
  workflow_dispatch:      # Permite rodar manualmente também

permissions:
  contents: write

jobs:
  update-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2   # Necessário para o action funcionar

      - uses: czl9707/gh-space-shooter@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          output-path: 'gh-space-shooter.gif'
          strategy: 'random'   # outras opções: 'row' ou 'column'
